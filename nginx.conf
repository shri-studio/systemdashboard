server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # never serve dotfiles (e.g. the .refresh trigger the agent watches)
    location ~ /\. { return 404; }

    location = /data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
